# =============================================================================
# Liu Lab Roadmap — MkDocs configuration
# =============================================================================
# Docs live in docs/. Bilingual content (English + 简体中文) is handled by the
# mkdocs-static-i18n plugin using the "suffix" file convention:
#   docs/foo.md      -> English (default locale)
#   docs/foo.zh.md   -> 简体中文
# A language switcher appears in the top bar automatically.
# =============================================================================

site_name: Liu Lab Roadmap
site_description: Curated roadmaps, tutorials, and learning materials for the Liu Lab.
site_author: Liu Lab

site_url: https://liuhlab.github.io/liulab-roadmap/
repo_url: https://github.com/liuhlab/liulab-roadmap
repo_name: liuhlab/liulab-roadmap
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    # NOTE: navigation.instant is intentionally omitted — it breaks the
    # mkdocs-static-i18n language switcher's contextual links.
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.tooltips
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # Vendored mermaid so diagrams render without reaching unpkg.com (readers
  # behind the GFW get a blank figure otherwise). Material only fetches its own
  # copy from the CDN when `window.mermaid` is still undefined, so loading ours
  # first wins. `defer` runs it before DOMContentLoaded, which is when Material
  # mounts the diagrams.
  - path: assets/javascripts/mermaid.min.js
    defer: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # ```mermaid fences -> diagrams. Material bundles mermaid.js and themes
        # it for light/dark automatically; no external script.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Glossary hover tooltips: wraps the first occurrence of each term from
# includes/glossary{,.zh}.md in <abbr>. See the module docstring for why the
# stock `abbr` extension can't be used here.
hooks:
  - hooks/glossary.py

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 实验室学习路线
          nav_translations:
            # Only section (grouping) labels need translation here — page titles
            # come from each file's own H1, so index.md/index.zh.md self-localize.
            Home: 首页
            Foundational Skills: 基本技能
            Biology Foundations: 生物学基础
            Experimental Techniques: 实验技术基础
            AI Model Foundations: 人工智能模型基础
            Lab Code & Tools: 实验室代码和工具
            Datasets: 实验室和公共数据集
            How To: 如何做
            Interesting Labs: 有趣的实验室
            Journal Club: 文献俱乐部
  # "Last update" date in each page's footer, taken from the file's last commit.
  # Must be listed AFTER i18n — the plugin errors out otherwise, because it reads
  # the per-locale tag i18n attaches to each file to pick the date format.
  - git-revision-date-localized:
      type: date
      # Render dates in the readers' timezone rather than UTC.
      timezone: Asia/Shanghai
      # The default turns "file not in git yet" into a warning, which --strict
      # then treats as an error: writing a new page and building it before
      # committing would fail. Not worth it for a footer note.
      strict: false

# Nav structure:
#   L1 = section (grouping header, not a page)
#   L2 = overview page
#   L3 = specific direction (add later; nest a page under an index.md and the
#        section-index feature makes the L2 overview clickable — see docs below)
nav:
  - Home: index.md
  - Foundational Skills:
      - 1-basics/1.1-llm-agents.md
      - 1-basics/1.2-linux-git.md
      - 1-basics/1.3-python.md
  - Biology Foundations:
      - 2-biology/2.1-molecular-epigenetics.md
      - 2-biology/2.2-neurobiology.md
      - 2-biology/2.3-neurodegeneration-aging.md
  - Experimental Techniques:
      - 3-experimental/3.1-molecular-biology-techniques.md
      - 3-experimental/3.2-genome-editing-delivery.md
      - 3-experimental/3.3-cell-animal-models.md
      - 3-experimental/3.4-genomics.md
      - 3-experimental/3.5-single-cell-omics.md
      - 3-experimental/3.6-bioinformatics.md
      - 3-experimental/3.7-r-statistics.md
  - AI Model Foundations:
      - 4-ai-models/4.1-data-science-ml.md
      - 4-ai-models/4.2-deep-learning.md
      - 4-ai-models/4.3-genome-sequence-models.md
      - 4-ai-models/4.4-protein-models.md
      - 4-ai-models/4.5-cell-state-models.md
      - 4-ai-models/4.6-ai-scientist.md
  - Lab Code & Tools:
      - 5-lab-code/5.1-routine-support.md
      - 5-lab-code/5.2-research-projects.md
  - Datasets:
      - 6-datasets/index.md
  - How To:
      - 7-how-to/index.md
  - Interesting Labs:
      - 8-interesting-labs/index.md
  - Journal Club:
      - 9-journal-club/index.md
