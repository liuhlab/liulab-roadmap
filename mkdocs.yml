# =============================================================================
# Liu Lab Roadmap — MkDocs configuration
# =============================================================================
# Docs live in docs/. Bilingual content (English + 简体中文) is handled by the
# mkdocs-static-i18n plugin using the "suffix" file convention:
#   docs/foo.md      -> English (default locale)
#   docs/foo.zh.md   -> 简体中文
# A language switcher appears in the top bar automatically.
# =============================================================================

site_name: Liu Lab Roadmap
site_description: Curated roadmaps, tutorials, and learning materials for the Liu Lab.
site_author: Liu Lab

site_url: https://liuhlab.github.io/liulab-roadmap/
repo_url: https://github.com/liuhlab/liulab-roadmap
repo_name: liuhlab/liulab-roadmap
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    # NOTE: navigation.instant is intentionally omitted — it breaks the
    # mkdocs-static-i18n language switcher's contextual links.
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 实验室学习路线
          nav_translations:
            # Only section (grouping) labels need translation here — page titles
            # come from each file's own H1, so index.md/index.zh.md self-localize.
            Home: 首页
            Foundational Skills: 基本技能
            Biology Foundations: 生物学基础
            Experimental Techniques: 实验技术基础
            AI Model Foundations: 人工智能模型基础
            Lab Code & Tools: 实验室代码和工具
            Datasets: 实验室和公共数据集
            How To: 如何做
            Interesting Labs: 有趣的实验室
            Journal Club: 文献俱乐部

# Nav structure:
#   L1 = section (grouping header, not a page)
#   L2 = overview page
#   L3 = specific direction (add later; nest a page under an index.md and the
#        section-index feature makes the L2 overview clickable — see docs below)
nav:
  - Home: index.md
  - Foundational Skills:
      - basics/llm-agents.md
      - basics/linux-git.md
      - basics/python.md
  - Biology Foundations:
      - biology/molecular-epigenetics.md
      - biology/neurobiology.md
      - biology/neurodegeneration-aging.md
  - Experimental Techniques:
      - experimental/molecular-biology-techniques.md
      - experimental/genome-editing-delivery.md
      - experimental/cell-animal-models.md
      - experimental/genomics.md
      - experimental/single-cell-omics.md
      - experimental/bioinformatics.md
  - AI Model Foundations:
      - ai-models/deep-learning.md
      - ai-models/genome-sequence-models.md
      - ai-models/protein-models.md
      - ai-models/cell-state-models.md
      - ai-models/ai-scientist.md
  - Lab Code & Tools:
      - lab-code/routine-support.md
      - lab-code/research-projects.md
  - Datasets:
      - datasets/index.md
  - How To:
      - how-to/index.md
  - Interesting Labs:
      - interesting-labs/index.md
  - Journal Club:
      - journal-club/index.md
