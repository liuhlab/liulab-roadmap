name: CI

# Lint docs and verify the site builds on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            docs/**/*.md
            *.md

  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The last-updated date comes from `git log` per file. A shallow
          # checkout stamps every page with the HEAD commit date and exits 0,
          # so this failing is invisible without the full history.
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - name: Build with MkDocs (strict)
        run: pixi run build
