# The gate, run on the pull request rather than on the branch.
#
# ONE job, because GitHub bills every job rounded up to a whole minute. The docs build runs
# even when the gate failed, so a run still reports every failure.
#
# Every step invokes `pixi run <task>` and never a command line. The step list lives in
# `pyproject.toml` (`check-static` names it once), and conformance rule `workflow-step-tasks`
# holds every workflow here to it.
#
# Publishing the site is deploy.yml, on `main`.
name: ci

on:
  # `pull_request` tests the MERGE commit. Nothing runs on a push to `main`: it would test again
  # what the pull request just tested. `workflow_dispatch` is for checking `main` by hand.
  #
  # `ready_for_review` is listed because a draft runs nothing (the job's `if:` below): open a
  # pull request as a draft, pass the local gate, then mark it ready to run CI once.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Pushing again to a pull request cancels the run it supersedes. A run started by hand is never
# cancelled.
concurrency:
  # The draft state is part of the key: a draft's run is skipped, and must not cancel the
  # real run that marking the pull request ready starts in the same second.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Skipped on a draft, which bills nothing. A run by hand has no pull request, so it runs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Each page's footer date comes from `git log` on its file. A shallow checkout stamps
          # every page with the HEAD commit date and still exits 0, so this failing is
          # invisible without the full history.
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # `docs` holds the site builder, which `default` does not.
          environments: default docs
          # Fail if `pixi.lock` no longer matches `pyproject.toml`, rather than silently
          # solving something else.
          locked: true
      - run: pixi run check-static
      # `--strict` is in the task, so a broken link or a missing nav page fails here.
      - run: pixi run docs-build
        if: ${{ !cancelled() }}
