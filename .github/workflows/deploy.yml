name: Deploy

# Build the MkDocs site and publish it to the `gh-pages` branch.
# In repo settings, set Pages -> Build and deployment -> Source to
# "Deploy from a branch", branch `gh-pages` / `(root)`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-deploy force-pushes the built site to the gh-pages branch.
permissions:
  contents: write

# Only one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, or every page shows the same date
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and deploy to gh-pages
        run: pixi run mkdocs gh-deploy --force --strict
