name: Deploy

# Build the site and publish it to the `gh-pages` branch, on every push to `main`.
# Repo settings: Pages -> Build and deployment -> Source is "Deploy from a branch",
# branch `gh-pages` / `(root)`.
#
# `mkdocs gh-deploy` rather than the template's two-step publish: the template writes its own
# because zensical has no gh-deploy, and this site builds with mkdocs.
on:
  push:
    branches: [main]
  # For re-publishing without a commit: a Pages setting changed, a deploy was lost.
  workflow_dispatch:

# gh-deploy force-pushes the built site to the gh-pages branch.
permissions:
  contents: write

# Only one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history, or every page shows the same date
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: docs
          locked: true
      - name: Build and deploy to gh-pages
        run: pixi run docs-deploy
        env:
          # The gh-pages commit's identity. ghp-import, which gh-deploy commits through, reads
          # these before git config, so the runner needs no `git config` step.
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
