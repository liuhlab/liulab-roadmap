# markdownlint (markdownlint-cli2) rules for the docs.
# Full rule list: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

default: true

# Line length: prose wraps naturally in the browser, and Chinese text has no
# spaces to break on, so don't enforce a hard column limit.
MD013: false

# Allow inline HTML — MkDocs/Material content and i18n snippets use it.
MD033: false

# Allow duplicate headings when nested under different parents (common in docs).
MD024:
  siblings_only: true

# First line need not be a top-level heading (front matter / includes).
MD041: false

# Permit ordered-list numbering styles other than strictly incrementing.
MD029:
  style: ordered

# Admonition bodies (`!!! note`) are 4-space indented by design; markdownlint
# has no concept of them and reads any multi-block body as a code block.
MD046: false
